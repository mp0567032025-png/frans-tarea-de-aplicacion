<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador de tareas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="encabezado">
      <p class="etiqueta">LABORATORIO · PROYECTO SUMATIVO</p>
      <h1>Mi organizador</h1>
      <p class="subtitulo">Organiza tus pendientes, un paso a la vez.</p>
    </header>
    <section class="panel" aria-labelledby="titulo-formulario">
      <h2 id="titulo-formulario">Agregar una tarea</h2>
      <form id="formulario-tarea">
        <label for="entrada-tarea">Descripción de la tarea</label>
        <div class="fila-formulario">
          <input id="entrada-tarea" name="tarea" type="text" maxlength="100" placeholder="Ej. Terminar la práctica de JavaScript" required>
          <button type="submit">Agregar</button>
        </div>
      </form>
      <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
    </section>
    <section class="panel" aria-labelledby="titulo-lista">
      <div class="encabezado-lista">
        <h2 id="titulo-lista">Mis tareas</h2>
        <span id="contador" class="contador">0 pendientes</span>
      </div>
      <ul id="lista-tareas" class="lista-tareas"></ul>
      <p id="estado-vacio" class="estado-vacio">Todavía no hay tareas. ¡Agrega la primera!</p>
      <button id="limpiar-completadas" class="boton-secundario" type="button">Eliminar completadas</button>
    </section>
    <footer>Proyecto educativo · HTML, CSS y JavaScript</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
